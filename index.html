        <h1>Executable governance for AI systems that can access, decide and act.</h1>
        <p>AI Governance Engineering</p>
        <p>
          I design technical controls, runtime boundaries and verifiable evidence for RAG systems,
          copilots, agents and high-consequence workflows.
        </p>
        <p>For CISOs, CTOs, risk leaders and teams moving AI from pilot to production.</p>
        <section id="why">
          <h2>Your system can be governed on paper and still be vulnerable at runtime.</h2>
          <ul>
            <li><strong>Access:</strong> What the system can read or retrieve (RAG, permissions, prompt injection).</li>
            <li><strong>Authority:</strong> What the system can trigger or change (tool allowlists, HITL gates, fail-safe).</li>
            <li><strong>Evidence:</strong> What you can reconstruct and prove afterwards (decision traces, SHA-256 logs).</li>
          </ul>
          <p><strong>What brings you here?</strong> [I am evaluating my AI system] · [I want to train my engineering team] · [I am looking for a technical partner] · [I want to explore co-delivery]</p>
